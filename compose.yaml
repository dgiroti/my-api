services:

  # ─────────── Container 1: the database ───────────
  mongo:
    image: mongo:8
    # NEW: use the Codespace's network directly instead of a private Docker network
    network_mode: host
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

       # ─────────── Container 2: Kafka ───────────
  kafka:
    image: apache/kafka:3.9.0   # official Apache Kafka image, no extra setup needed
    network_mode: host          # same workaround as before: listens on localhost:9092
    # Ask Kafka "are you ready?" by requesting its API versions
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ─────────── Container 3: our API ───────────
  api:
    build: .
    # NEW: same network as mongo, so they can talk over 127.0.0.1
    network_mode: host
    # REMOVED: "ports" — with host networking the app listens on 3000 directly,
    # so there's nothing to map
    environment:
      PORT: 3000
      # CHANGED: mongo is now reachable on this machine's own address
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: localhost:9092 
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy 
    restart: on-failure

    # ─────────── The audit service (consumer) ───────────
  audit:
    build: .                          # same image as the API...
    network_mode: host
    # ...but run a different program inside it
    command: ["node", "dist/consumer/auditService.js"]
    environment:
      MONGO_URI: "${MONGO_URI}"
      # Not used by this service, but our shared config.ts requires it
      JWT_SECRET: "${JWT_SECRET}"
      KAFKA_BROKERS: localhost:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

volumes:
  mongo-data: