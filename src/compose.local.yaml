services:
  # ─────────── Container 1: the database ───────────
  mongo:
    image: mongo:8
    # NEW: use the Codespace's network directly instead of a private Docker network
    network_mode: host
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────── Container 2: our API ───────────
  api:
    build: .
    # NEW: same network as mongo, so they can talk over 127.0.0.1
    network_mode: host
    # REMOVED: "ports" — with host networking the app listens on 3000 directly,
    # so there's nothing to map
    environment:
      PORT: 3000
      # CHANGED: mongo is now reachable on this machine's own address
      MONGO_URI: mongodb://127.0.0.1:27017/my_api
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    restart: on-failure

volumes:
  mongo-data: