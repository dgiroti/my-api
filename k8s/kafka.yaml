# ═══════════ The Deployment: "keep 1 Kafka pod running" ═══════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  # Stop the old Kafka pod BEFORE starting a new one during updates,
  # so two Kafka servers never run with the same identity
  strategy:
    type: Recreate
  # "Which pods belong to me?" → the ones labelled app: kafka
  selector:
    matchLabels:
      app: kafka
  # The template is the blueprint for each pod
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes normally adds extra variables like KAFKA_PORT to every pod.
      # The Kafka image would misread those as settings, so we turn that off.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: my-kafka:3.9.0
          ports:
            - containerPort: 9092
          env:
            # This Kafka is a single server doing both jobs (broker + controller)
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # The address Kafka tells clients to use: the Service name "kafka"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            # With only 1 server, keep only 1 copy of Kafka's internal data
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          # Kubernetes' version of a healthcheck:
          # the pod is "ready" once something answers on port 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ═══════════ The Service: a fixed name "kafka" for the Kafka pod ═══════════
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka       # send traffic to pods labelled app: kafka
  ports:
    - port: 9092
      targetPort: 9092