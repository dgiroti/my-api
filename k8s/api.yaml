# ═══════════ Deployment: "keep 2 API pods running" ═══════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2              # two copies of the API, for reliability
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: my-api:v1 # the image we loaded in Step 4
          ports:
            - containerPort: 3000
          # Load every value from the ConfigMap and the Secret as environment variables
          envFrom:
            - configMapRef:
                name: my-api-config
            - secretRef:
                name: my-api-secrets
          # Only send traffic to a pod once its web server answers on "/"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
---
# ═══════════ Service: a fixed name "api" that spreads traffic across both pods ═══════════
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000